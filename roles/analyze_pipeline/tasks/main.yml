---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - rgctl_dest | length > 0
    fail_msg: "rgctl_dest must be set"

- name: Install rgctl binary (local machines only)
  rgctl.rgctl.rgctl_install:
    version: "{{ rgctl_version }}"
    install_path: "{{ rgctl_install_path }}"
  when: rgctl_manage_install | bool

- name: Clone repository
  ansible.builtin.git:
    repo: >-
      {%- if rgctl_git_token | length > 0 -%}
      {{ rgctl_git_url | regex_replace('^https://', 'https://' + rgctl_git_token + '@') }}
      {%- else -%}
      {{ rgctl_git_url }}
      {%- endif -%}
    dest: "{{ rgctl_dest }}"
    version: "{{ rgctl_branch }}"
    key_file: "{{ rgctl_git_key if rgctl_git_key | length > 0 else omit }}"
    depth: "{{ rgctl_git_depth if rgctl_git_depth | int > 0 else omit }}"
    force: false
  no_log: "{{ (rgctl_git_token | length > 0) | bool }}"
  when: rgctl_git_url | length > 0

- name: Remove token from git remote URL
  ansible.builtin.command:
    cmd: "git remote set-url origin {{ rgctl_git_url }}"
    chdir: "{{ rgctl_dest }}"
  when:
    - rgctl_git_url | length > 0
    - rgctl_git_token | length > 0
  changed_when: false

- name: Discover and index codebase
  rgctl.rgctl.rgctl_discover:
    path: "{{ rgctl_dest }}"
    force: "{{ rgctl_force_discover }}"
    full: "{{ rgctl_discover_full }}"
    files: "{{ rgctl_discover_files }}"
    find_glob: "{{ rgctl_discover_find_glob | default(omit) }}"
    timeout: "{{ rgctl_discover_timeout }}"
    rgctl_bin: "{{ rgctl_bin }}"
    with_cfg: "{{ rgctl_with_cfg }}"
    with_git: "{{ rgctl_with_git }}"
    git_since: "{{ rgctl_git_since | default(omit) }}"
    with_security: "{{ rgctl_with_security }}"
    with_taint: "{{ rgctl_with_taint }}"
    taint_rules: "{{ rgctl_taint_rules | default(omit) }}"
    with_ast_skeleton: "{{ rgctl_with_ast_skeleton }}"
    with_dfg_loops: "{{ rgctl_with_dfg_loops }}"
    with_harmonic: "{{ rgctl_with_harmonic }}"
    with_universe: "{{ rgctl_with_universe }}"
    with_limits: "{{ rgctl_with_limits | default(omit) }}"
    scip: "{{ rgctl_scip | default(omit) }}"
    write_json_graph: "{{ rgctl_write_json_graph }}"
    export_migration_hints: "{{ rgctl_export_migration_hints }}"
    with_kantra: "{{ rgctl_with_kantra }}"
    kantra_rules: "{{ rgctl_kantra_rules | default(omit) }}"
    kantra_catalog: "{{ rgctl_kantra_catalog | default(omit) }}"
    kantra_target: "{{ rgctl_kantra_target | default(omit) }}"
    kantra_index_only: "{{ rgctl_kantra_index_only }}"
  register: _rgctl_discover

- name: Run security scan
  rgctl.rgctl.rgctl_security:
    path: "{{ rgctl_dest }}"
    checks: "{{ rgctl_checks }}"
    osv_file: "{{ rgctl_osv_file }}"
    sink_symbols: "{{ rgctl_sink_symbols }}"
    taint_depth: "{{ rgctl_taint_depth }}"
    severity_threshold: "{{ rgctl_severity_threshold }}"
    rgctl_bin: "{{ rgctl_bin }}"
    timeout: "{{ rgctl_scan_timeout }}"
  register: _rgctl_security

- name: Collect code metrics
  rgctl.rgctl.rgctl_metrics:
    path: "{{ rgctl_dest }}"
    metrics: "{{ rgctl_metrics }}"
    top_n: "{{ rgctl_metrics_top_n }}"
    rgctl_bin: "{{ rgctl_bin }}"
    timeout: "{{ rgctl_metrics_timeout }}"
  register: _rgctl_metrics
  when: rgctl_collect_metrics | bool

- name: Write analysis report
  rgctl.rgctl.rgctl_report:
    dest: "{{ rgctl_report_dest }}"
    findings: "{{ _rgctl_security.rgctl_security_findings }}"
    format: "{{ rgctl_report_format }}"
    index_info: "{{ _rgctl_discover.rgctl_index }}"
    metrics: "{{ _rgctl_metrics.rgctl_metrics | default({}) }}"
  register: _rgctl_report

- name: Expose analysis summary as host fact
  ansible.builtin.set_fact:
    rgctl_analysis:
      index: "{{ _rgctl_discover.rgctl_index }}"
      findings: "{{ _rgctl_security.rgctl_security_findings }}"
      above_threshold_count: "{{ _rgctl_security.above_threshold_count }}"
      metrics: "{{ _rgctl_metrics.rgctl_metrics | default({}) }}"
      report_path: "{{ _rgctl_report.report_path }}"

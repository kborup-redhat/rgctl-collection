---
- name: Test rgctl analyze_pipeline against a Java codebase
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rgctl_git_url: "https://github.com/spring-projects/spring-petclinic"
    rgctl_dest: "/tmp/rgctl-test-java/spring-petclinic"
    rgctl_branch: "main"
    rgctl_manage_install: false   # rgctl already in PATH
    rgctl_checks:
      - vuln
      - deps
      - security
    rgctl_severity_threshold: low
    rgctl_report_dest: "/tmp/rgctl-test-java/report.json"
    rgctl_report_format: json

  roles:
    - role: rgctl.rgctl.analyze_pipeline

  post_tasks:
    - name: Show analysis summary
      ansible.builtin.debug:
        msg:
          - "Files indexed : {{ rgctl_analysis.index.files_indexed }}"
          - "Graph nodes   : {{ rgctl_analysis.index.nodes }}"
          - "Graph edges   : {{ rgctl_analysis.index.edges }}"
          - "Total findings: {{ rgctl_analysis.findings | length }}"
          - "Above threshold: {{ rgctl_analysis.above_threshold_count }}"
          - "Report written: {{ rgctl_analysis.report_path }}"

    - name: Fail if critical findings found
      ansible.builtin.fail:
        msg: "{{ rgctl_analysis.above_threshold_count }} finding(s) at or above 'low' threshold — review report"
      when: rgctl_analysis.above_threshold_count | int > 0
      ignore_errors: true

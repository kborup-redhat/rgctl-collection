---
- name: Test rgctl full pipeline against spring-petclinic (Java)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rgctl_git_url: "https://github.com/spring-projects/spring-petclinic"
    rgctl_dest: "/tmp/rgctl-test-java/spring-petclinic"
    rgctl_branch: "main"
    rgctl_git_depth: 1
    rgctl_manage_install: false

    # Security: check for Spring4Shell (CVE-2022-22965)
    rgctl_checks:
      - deps_check
      - vuln_analyze
    # Download advisory first: curl -s https://api.osv.dev/v1/vulns/GHSA-36p3-wjmg-h94x > /tmp/spring4shell.json
    rgctl_osv_file: "/tmp/spring4shell.json"
    rgctl_severity_threshold: low

    # Metrics
    rgctl_collect_metrics: true
    rgctl_metrics:
      - pagerank
      - communities
    rgctl_metrics_top_n: 5

    rgctl_report_dest: "/tmp/rgctl-test-java/report-full.json"
    rgctl_report_format: json

  roles:
    - role: rgctl.rgctl.analyze_pipeline

  post_tasks:
    - name: Show analysis summary
      ansible.builtin.debug:
        msg:
          - "Files indexed      : {{ rgctl_analysis.index.files_indexed }}"
          - "Graph nodes        : {{ rgctl_analysis.index.nodes }}"
          - "Graph edges        : {{ rgctl_analysis.index.edges }}"
          - "Advisory checked   : Spring4Shell (CVE-2022-22965)"
          - "Security findings  : {{ rgctl_analysis.findings | length }}"
          - "Above threshold    : {{ rgctl_analysis.above_threshold_count }}"
          - "Communities found  : {{ rgctl_analysis.metrics.communities.count | default('n/a') }}"
          - "Graph modularity   : {{ rgctl_analysis.metrics.communities.modularity | default('n/a') }}"
          - "Report             : {{ rgctl_analysis.report_path }}"

    - name: Show top symbols by PageRank
      ansible.builtin.debug:
        msg: "{{ item.qualified_name }} ({{ item.kind }}) — score {{ item.pagerank | round(6) }}"
      loop: "{{ rgctl_analysis.metrics.pagerank_top | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
